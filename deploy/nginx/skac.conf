# Host Nginx for SKAC (no Docker).
# 1. Copy the built UI:  frontend/dist  is the nginx root
# 2. Enable:  ln -s /opt/skac/deploy/nginx/skac.conf /etc/nginx/sites-enabled/skac
# 3. Replace server_name with your domain or droplet IP

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DROPLET_IP;

    root /opt/skac/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
