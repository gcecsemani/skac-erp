# SKAC HTTPS (host Nginx, no Docker).
#
# TLS terminates here. The FastAPI unit must stay on 127.0.0.1:5174 — do not
# put certificates on uvicorn. Field visits need a trusted HTTPS origin so
# the browser will allow GPS (and camera) access.
#
# Install with deploy/nginx/setup-https.sh (recommended), or:
#   1. Issue a cert (see that script)
#   2. Copy this file to /etc/nginx/sites-available/skac
#   3. Copy skac-proxy.inc to /etc/nginx/skac-proxy.inc
#   4. Set server_name + ssl_certificate paths to your cert lineage
#   5. nginx -t && systemctl reload nginx
#
# Replace 64.227.168.129 with your domain if you have one. Cert paths must
# match /etc/letsencrypt/live/<name>/.

# HTTP :80 — ACME renewals + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 64.227.168.129;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Old HTTP bookmark http://IP:5173 → HTTPS on 443
server {
    listen 5173;
    listen [::]:5173;
    server_name 64.227.168.129;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Public site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 64.227.168.129;

    ssl_certificate     /etc/letsencrypt/live/64.227.168.129/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/64.227.168.129/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # Uncomment after HTTPS has been working for a day (hard to roll back):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/skac-proxy.inc;
}
