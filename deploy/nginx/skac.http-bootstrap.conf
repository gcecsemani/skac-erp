# Temporary HTTP config used only while issuing a Let's Encrypt certificate.
# Keeps the existing :5173 site online and exposes :80 for the ACME challenge.
#
# After setup-https.sh succeeds, this file is replaced by skac.conf.

server {
    listen 80;
    listen [::]:80;
    server_name 64.227.168.129;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 http://$host:5173$request_uri;
    }
}

server {
    listen 5173;
    listen [::]:5173;
    server_name 64.227.168.129;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    include /etc/nginx/skac-proxy.inc;
}
